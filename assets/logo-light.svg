<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <!-- Memory chip outline -->
  <rect x="16" y="20" width="80" height="80" rx="8" stroke="#2563EB" stroke-width="3" fill="none"/>

  <!-- Chip pins left -->
  <line x1="0" y1="38" x2="16" y2="38" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="0" y1="54" x2="16" y2="54" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="0" y1="70" x2="16" y2="70" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="0" y1="86" x2="16" y2="86" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Chip pins right -->
  <line x1="96" y1="38" x2="112" y2="38" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="96" y1="54" x2="112" y2="54" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="96" y1="70" x2="112" y2="70" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="96" y1="86" x2="112" y2="86" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Chip pins top -->
  <line x1="36" y1="4" x2="36" y2="20" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="56" y1="4" x2="56" y2="20" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="76" y1="4" x2="76" y2="20" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Chip pins bottom -->
  <line x1="36" y1="100" x2="36" y2="116" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="56" y1="100" x2="56" y2="116" stroke="#2563EB" stroke-width="2.5"/>
  <line x1="76" y1="100" x2="76" y2="116" stroke="#2563EB" stroke-width="2.5"/>

  <!-- Checkmark inside chip -->
  <polyline points="38,60 50,72 74,46" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Text: memeval -->
  <text x="130" y="72" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="42" font-weight="700" fill="#1E293B">
    mem<tspan fill="#2563EB">eval</tspan>
  </text>

  <!-- Tagline -->
  <text x="132" y="96" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#64748B">
    find out why your agent forgot
  </text>
</svg>
