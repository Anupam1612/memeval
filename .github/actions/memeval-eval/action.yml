name: "memeval - Memory Evaluation"
description: "Evaluate agent memory systems against standardized scenarios and metrics"
author: "Anupam1612"

branding:
  icon: "cpu"
  color: "blue"

inputs:
  adapter:
    description: "Memory adapter to evaluate (in_memory, mem0, zep, letta)"
    required: false
    default: "in_memory"
  scenarios:
    description: "Path to scenarios directory, or 'builtin' for built-in suite"
    required: false
    default: "builtin"
  threshold:
    description: "Minimum overall score to pass (0.0-1.0)"
    required: false
    default: "0.7"
  report-path:
    description: "Path to write JSON report"
    required: false
    default: "memeval-report.json"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"
  extra-deps:
    description: "Extra pip dependencies (e.g. 'memeval[mem0]' or 'memeval[all]')"
    required: false
    default: ""
  post-comment:
    description: "Post results as PR comment (true/false)"
    required: false
    default: "true"

outputs:
  overall-score:
    description: "Overall evaluation score (0.0-1.0)"
    value: ${{ steps.run-eval.outputs.overall-score }}
  passed:
    description: "Whether all scenarios passed (true/false)"
    value: ${{ steps.run-eval.outputs.passed }}
  scenarios-passed:
    description: "Number of scenarios that passed"
    value: ${{ steps.run-eval.outputs.scenarios-passed }}
  scenarios-total:
    description: "Total number of scenarios run"
    value: ${{ steps.run-eval.outputs.scenarios-total }}
  report-path:
    description: "Path to the JSON report file"
    value: ${{ inputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install memeval
      shell: bash
      run: |
        pip install memeval
        if [ -n "${{ inputs.extra-deps }}" ]; then
          pip install ${{ inputs.extra-deps }}
        fi

    - name: Run evaluation
      id: run-eval
      shell: bash
      run: |
        python ${{ github.action_path }}/run_eval.py \
          --adapter "${{ inputs.adapter }}" \
          --scenarios "${{ inputs.scenarios }}" \
          --threshold "${{ inputs.threshold }}" \
          --report "${{ inputs.report-path }}" \
          --github-output "$GITHUB_OUTPUT" \
          --github-step-summary "$GITHUB_STEP_SUMMARY"

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: memeval-report
        path: ${{ inputs.report-path }}

    - name: Post PR comment
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('${{ inputs.report-path }}', 'utf8'));
          const s = report.summary;

          const status = s.overall_passed ? 'PASSED' : 'FAILED';
          const dims = Object.entries(report.dimensions)
            .map(([name, d]) => `| ${name} | ${d.score.toFixed(3)} | ${d.threshold} | ${d.passed ? 'PASS' : 'FAIL'} |`)
            .join('\n');

          const scenarios = report.scenarios.map(sc => {
            const metrics = Object.entries(sc.metrics)
              .map(([m, v]) => `  - ${m}: ${v.score.toFixed(3)} ${v.passed ? '' : '-- below ' + v.threshold}`)
              .join('\n');
            return `- [${sc.passed ? 'PASS' : 'FAIL'}] **${sc.name}**\n${metrics}`;
          }).join('\n');

          const body = [
            `## memeval Memory Evaluation: ${status}`,
            '',
            `**Adapter:** \`${{ inputs.adapter }}\` | **Score:** ${s.overall_score.toFixed(3)} | **Scenarios:** ${s.scenarios_passed}/${s.scenarios_run} passed`,
            '',
            '| Dimension | Score | Threshold | Status |',
            '|-----------|-------|-----------|--------|',
            dims,
            '',
            '<details>',
            '<summary>Scenario details</summary>',
            '',
            scenarios,
            '',
            '</details>',
            '',
            '---',
            '*Generated by [memeval](https://github.com/Anupam1612/memeval)*',
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes('memeval Memory Evaluation'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
