name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/memeval/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v

  memeval:
    name: Memory Evaluation (dogfood)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install memeval
        run: pip install -e ".[dev]"

      - name: Run built-in scenarios against InMemoryAdapter
        run: memeval run --adapter in_memory --output memeval-report.json --verbose
        continue-on-error: true  # InMemoryAdapter has known limitations (7/10 pass)

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memeval-report
          path: memeval-report.json
